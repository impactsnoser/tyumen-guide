name: tyumen_guide
description: "ДубльВуд — гид, навигатор и путеводитель с маршрутами и картой."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  introduction_screen: ^3.1.14
  shared_preferences: ^2.3.2
  flutter_map_marker_cluster: ^8.2.2
  flutter_map_animations: ^0.10.0
  flutter_svg: ^2.0.10

  cupertino_icons: ^1.0.8
  flutter_map_tile_caching: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/places/

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: assets/app_icon.png
